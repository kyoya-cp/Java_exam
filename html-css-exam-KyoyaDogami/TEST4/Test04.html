<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./Test04.css">
	<title>Document</title>
</head>
<body>
	<table>
		<tr>
			<th class="borderTh">/</th>
			<th class="borderTh">A</th>
			<th class="borderTh">B</th>
			<th class="borderTh">C</th>
			<th colspan="2" class="borderTh">D & E</th>
		</tr>
		<tr>
			<td rowspan="3" class="borderTd"><></td>
			<td class="borderTd">1 × 1</td>
			<td class="borderTd">1 × 2</td>
			<td class="borderTd">1 × 3</td>
			<td class="borderTd">1 × 4</td>
			<td class="borderTd">1 × 5</td>
		</tr>
		<tr>
			<td class="borderTd">2 × 1</td>
			<td class="borderTd">2 × 2</td>
			<td class="borderTd">2 × 3</td>
			<td class="borderTd">2 × 4</td>
			<td class="borderTd">2 × 5</td>
		</tr>
		<tr>
			<td class="borderTd">3 × 1</td>
			<td class="borderTd">3 × 2</td>
			<td class="borderTd">3 × 3</td>
			<td class="borderTd">3 × 4</td>
			<td class="borderTd">3 × 5</td>
		</tr>
	</table>
</body>
</html>
