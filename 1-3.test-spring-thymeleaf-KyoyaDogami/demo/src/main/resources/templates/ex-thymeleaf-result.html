<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	私の名前は<span th:text="${member.name}">JONNY</span>です。<br>
	<span th:if="${member.age>=20}" th:text="成人"></span><span th:unless="${member.age>=20}" th:text="未成年"></span>です。<br>
	趣味は「<span th:each="hobby:${member.hobbylist}"><span th:text="${hobby}"></span></span>」です。<br>
</body>
</html>
